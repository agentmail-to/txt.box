packages:
  - app
  - workers/*
  - shared

allowBuilds:
  # Required native runtime binaries used by Vite and Wrangler.
  esbuild: true
  workerd: true

# Ranges, not exact pins: an exact pin here applies unconditionally and would
# silently downgrade a transitive dep once its parent ships a newer patched
# version. Each floor is the first release that clears the advisory.
overrides:
  esbuild@>=0.27.3 <0.28.1: 0.28.1
  nanoid: ^3.3.18
  picomatch: ^4.0.4
  postcss: ^8.5.26
  rollup: ^4.59.0
  sharp: ^0.35.0
  undici: ^7.29.0
  ws: ^8.21.0
