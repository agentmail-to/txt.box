name = "txtbox-api-session"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# --- Dev environment ---
[env.dev]
name = "txtbox-api-session-dev"

[env.dev.vars]
S2_BASIN = "txtbox-dev"
R2_PUBLIC_BASE = "https://snapshots.txtbox.dev"

[[env.dev.r2_buckets]]
binding = "SNAPSHOTS_BUCKET"
bucket_name = "txtbox-snapshots-dev"

[[env.dev.routes]]
pattern = "api.txtbox.dev"
custom_domain = true

[[env.dev.ratelimits]]
name = "SESSION_LIMITER"
namespace_id = "2001"

  [env.dev.ratelimits.simple]
  limit = 20
  period = 60

[[env.dev.ratelimits]]
name = "APPEND_LIMITER"
namespace_id = "2002"

  [env.dev.ratelimits.simple]
  limit = 1200
  period = 60

[[env.dev.ratelimits]]
name = "READ_LIMITER"
namespace_id = "2003"

  [env.dev.ratelimits.simple]
  limit = 120
  period = 60

# --- Prod environment ---
[env.prod]
name = "txtbox-api-session-prod"

[env.prod.vars]
S2_BASIN = "txtbox-prod"
R2_PUBLIC_BASE = "https://snapshots.txt.box"

[[env.prod.r2_buckets]]
binding = "SNAPSHOTS_BUCKET"
bucket_name = "txtbox-snapshots-prod"

[[env.prod.routes]]
pattern = "api.txt.box"
custom_domain = true

[[env.prod.ratelimits]]
name = "SESSION_LIMITER"
namespace_id = "1001"

  [env.prod.ratelimits.simple]
  limit = 20
  period = 60

[[env.prod.ratelimits]]
name = "APPEND_LIMITER"
namespace_id = "1002"

  [env.prod.ratelimits.simple]
  limit = 1200
  period = 60

[[env.prod.ratelimits]]
name = "READ_LIMITER"
namespace_id = "1003"

  [env.prod.ratelimits.simple]
  limit = 120
  period = 60
